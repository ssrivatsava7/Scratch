name: dopamine2_0
description: "YouTube Audio Player built with Flutter & MediaKit"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  get: ^4.6.6
  get_storage: ^2.1.1

  # Media playback (latest stable & Windows compatible)
  media_kit: ^1.1.10
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7
  media_kit_libs_audio: ^1.0.7
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_windows_audio: ^1.0.9  # ✅ Add this line for proper Windows audio backend
  flutter_slidable: ^3.0.1

  # YouTube integration
  youtube_explode_dart: ^2.5.3
  youtube_player_iframe: ^5.2.0  # YouTube player with iframe support
  path_provider: ^2.1.3

  # Networking
  http: ^1.1.0
  dio: ^5.4.0  # For downloading files with progress
  uuid: ^3.0.7

  # Platform-specific
  webview_windows: ^0.4.0
  cupertino_icons: ^1.0.8
  wakelock_plus: ^1.1.4

  # Storage & persistence
  shared_preferences: ^2.2.2


  # Background playback (optional)
  # audio_service: ^0.18.12

  # Permissions
  permission_handler: ^12.0.1
  video_player: ^2.10.1
  cached_network_image: ^3.3.1
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.2
 

dependency_overrides:
  win32: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
